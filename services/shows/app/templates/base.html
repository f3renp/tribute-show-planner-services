<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tribute Show Planner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header>
    <strong>Tribute Show Planner</strong>
    <nav>
      <a href="{{ catalogue_public_url }}/catalogue/">Songs</a>
      <a href="{{ catalogue_public_url }}/catalogue/outfits">Outfits</a>
      <a href="{{ url_for('shows.show_list') }}">Shows</a>
    </nav>
  </header>
  <main>
    {% if errors %}
    <ul class="errors">
      {% for error in errors %}
      <li>{{ error }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
